[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_encoder"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Learn shared representations from repeated measurements and multiview data using linear and nonlinear encoders."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Marcos-Manchón", email = "pmarcos@ub.edu" }]
maintainers = [{ name = "Pablo Marcos-Manchón", email = "pmarcos@ub.edu" }]
dependencies = [
    "scikit-learn>=1.6",
    "scipy>=1.9",
    "numpy",
    "torch",
    "lazy_loader",
    "pandas",
]

[project.optional-dependencies]
utils = ["datasets", "pillow", "tqdm"]
wandb = ["wandb"]
docs = ["sphinx>=8", "furo>=2024.8.6", "myst-nb>=1.1", "sphinx-design>=0.6"]

[tool.setuptools.dynamic]
version = { attr = "neural_encoder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neural_encoder._mcca" = ["LICENSE"]
